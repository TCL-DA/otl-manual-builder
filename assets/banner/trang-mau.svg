      <circle cx="662" cy="274" r="3"/><circle cx="662" cy="346" r="3"/><circle cx="662" cy="418" r="3"/>
    </g>
    <text x="676" y="100">Header xanh + logo 34 pt  ·  y = 32</text>
    <text x="676" y="148">H2 kèm huy hiệu tròn Ø21 pt</text>
