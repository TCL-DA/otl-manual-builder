<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" width="1040" height="560" role="img" aria-label="Cau truc mot trang manual OTL do engine.jsx dan">
  <style>
    .t   { font-family: Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .ttl { font-size: 19px; font-weight: 300; letter-spacing: 1.6px; fill: #000000; }
    .lbl { font-size: 13px; font-weight: 300; letter-spacing: 0.2px; fill: #000000; }
    .sub { font-size: 11px; font-weight: 300; letter-spacing: 1.2px; fill: #b2b2b2; }
    .num { font-size: 11px; font-weight: 300; letter-spacing: 1.2px; fill: #000000; }
  </style>

  <rect width="1040" height="560" fill="#f6f8f7"/>

  <!-- title band -->
  <text class="t ttl" x="66" y="44">cấu trúc một trang</text>
  <text class="t sub" x="974" y="44" text-anchor="end">ENGINE.JSX &#183; A4 595.28 × 841.89 PT</text>
  <line x1="66" y1="66" x2="974" y2="66" stroke="#000000" stroke-width="1"/>

  <!-- ============ the page: the only rich object ============ -->
  <g transform="translate(96, 100)">
    <rect x="0" y="0" width="300" height="424" fill="#ffffff" stroke="#e5e5e5" stroke-width="1"/>

    <!-- margin guides -->
    <rect x="30" y="34" width="240" height="356" fill="none" stroke="#e5e5e5" stroke-width="1" stroke-dasharray="3 3"/>

    <!-- 1 header -->
    <rect x="0" y="0" width="300" height="22" fill="#2E74B5"/>
    <rect x="256" y="5" width="32" height="12" fill="#f6f8f7"/>
    <rect x="12" y="8" width="86" height="5" fill="#f6f8f7" opacity="0.85"/>

    <!-- 2 H1 -->
    <rect x="30" y="44" width="170" height="9" fill="#232323"/>

    <!-- body -->
    <g fill="#b2b2b2">
      <rect x="30" y="66" width="240" height="3"/><rect x="30" y="74" width="240" height="3"/>
      <rect x="30" y="82" width="176" height="3"/>
    </g>

    <!-- 3 H2 badge -->
    <circle cx="37" cy="106" r="7" fill="#4A87C7"/>
    <rect x="50" y="102" width="120" height="7" fill="#232323"/>
    <g fill="#b2b2b2">
      <rect x="30" y="122" width="240" height="3"/><rect x="30" y="130" width="206" height="3"/>
    </g>

    <!-- 4 safety box -->
    <rect x="30" y="148" width="240" height="46" fill="#ffffff" stroke="#E26C0A" stroke-width="1"/>
    <rect x="30" y="148" width="240" height="13" fill="#E26C0A"/>
    <path d="M42 186 L50 170 L58 186 Z" fill="#E26C0A"/>
    <g fill="#b2b2b2">
      <rect x="66" y="170" width="190" height="3"/><rect x="66" y="178" width="142" height="3"/>
    </g>

    <!-- 5 image + numbered callout -->
    <rect x="30" y="208" width="240" height="96" fill="#f6f8f7"/>
    <rect x="150" y="228" width="58" height="40" fill="none" stroke="#C00000" stroke-width="1"/>
    <circle cx="150" cy="228" r="7" fill="#C00000"/>
    <rect x="86" y="312" width="128" height="3" fill="#b2b2b2"/>

    <!-- 6 table -->
    <rect x="30" y="330" width="240" height="14" fill="#2E74B5"/>
    <g fill="#e5e5e5">
      <rect x="30" y="346" width="240" height="11"/><rect x="30" y="359" width="240" height="11"/>
      <rect x="30" y="372" width="240" height="11"/>
    </g>

    <!-- 7 footer -->
    <line x1="30" y1="398" x2="270" y2="398" stroke="#2E74B5" stroke-width="1"/>
    <rect x="30" y="404" width="96" height="4" fill="#b2b2b2"/>
    <rect x="240" y="404" width="30" height="4" fill="#2E74B5"/>
  </g>

  <!-- ============ hairline leaders + labels ============ -->
  <g stroke="#000000" stroke-width="1" fill="none">
    <path d="M396 111 H436 V96  H466"/>
    <path d="M396 149 H436 V153 H466"/>
    <path d="M396 225 H436 V218 H466"/>
    <path d="M396 271 H436 V303 H466"/>
    <path d="M396 356 H436 V384 H466"/>
    <path d="M396 437 H436 V453 H466"/>
    <path d="M396 504 H436 V510 H466"/>
  </g>
  <g stroke="#e5e5e5" stroke-width="1">
    <line x1="470" y1="128" x2="974" y2="128"/>
    <line x1="470" y1="185" x2="974" y2="185"/>
    <line x1="470" y1="250" x2="974" y2="250"/>
    <line x1="470" y1="335" x2="974" y2="335"/>
    <line x1="470" y1="416" x2="974" y2="416"/>
    <line x1="470" y1="485" x2="974" y2="485"/>
  </g>

  <g class="t">
    <text class="num" x="470" y="100">01</text>
    <text class="lbl" x="506" y="100">chapterHeader + logo</text>
    <text class="sub" x="506" y="118">THANH XANH ĐẦU TRANG, GÁN TRƯỚC addPage()</text>

    <text class="num" x="470" y="157">02</text>
    <text class="lbl" x="506" y="157">H1 &#183; H2(số, chữ) &#183; H3</text>
    <text class="sub" x="506" y="175">H2 CÓ HUY HIỆU TRÒN, TỰ VÀO MỤC LỤC VÀ BOOKMARK</text>

    <text class="num" x="470" y="222">03</text>
    <text class="lbl" x="506" y="222">P &#183; PI &#183; BUL &#183; STEP</text>
    <text class="sub" x="506" y="240">CHỮ CANH ĐỀU, TỰ ĐO CHIỀU CAO, TỰ SANG TRANG</text>

    <text class="num" x="470" y="307">04</text>
    <text class="lbl" x="506" y="307">SAFETY(loại, tiêu đề, thân)</text>
    <text class="sub" x="506" y="325">4 CẤP ISO 3864 — NGUY HIỂM &#183; CẢNH BÁO &#183; THẬN TRỌNG &#183; LƯU Ý</text>

    <text class="num" x="470" y="388">05</text>
    <text class="lbl" x="506" y="388">IMGC(file, rộng, chú thích, marks)</text>
    <text class="sub" x="506" y="406">KHUNG ĐỎ ĐÁNH SỐ ĐẶT THEO TỈ LỆ 0–1 CỦA ẢNH</text>

    <text class="num" x="470" y="457">06</text>
    <text class="lbl" x="506" y="457">TABLE(cols, rows, widths)</text>
    <text class="sub" x="506" y="475">TỔNG WIDTHS = 435.28 PT, TỰ LẶP HÀNG TIÊU ĐỀ KHI SANG TRANG</text>

    <text class="num" x="470" y="514">07</text>
    <text class="lbl" x="506" y="514">PGPREFIX + FOOTLINE</text>
    <text class="sub" x="506" y="532">SỐ TRANG TỰ ĐIỀN VÀO MỤC LỤC QUA TOCDRAW()</text>
  </g>
</svg>
