<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-label="otl-manual-builder - bo dan trang tai lieu huong dan may rang bang Adobe Illustrator">
  <style>
    .t  { font-family: Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .wm { font-size: 19px; font-weight: 300; letter-spacing: 2.2px; fill: #000000; }
    .nav{ font-size: 11px; font-weight: 300; letter-spacing: 1.6px; fill: #000000; }
    .h  { font-size: 40px; font-weight: 300; letter-spacing: -0.2px; fill: #000000; }
    .p  { font-size: 13px; font-weight: 300; letter-spacing: 0.2px; fill: #000000; }
    .m  { font-size: 11px; font-weight: 300; letter-spacing: 1.4px; fill: #b2b2b2; }
    .inv{ font-size: 11px; font-weight: 300; letter-spacing: 1.6px; fill: #b2b2b2; }
  </style>

  <!-- canvas mist -->
  <rect width="1280" height="340" fill="#f6f8f7"/>

  <!-- nav band -->
  <text class="t wm" x="66" y="42">o tesla industry</text>
  <text class="t nav" x="694" y="42" text-anchor="end">ENGINE &#183; SKILL &#183; MCP</text>
  <line x1="0" y1="66" x2="760" y2="66" stroke="#000000" stroke-width="1"/>

  <!-- left column -->
  <text class="t h"  x="66" y="166">otl-manual-builder</text>
  <text class="t p"  x="66" y="196">bộ dàn trang tài liệu hướng dẫn máy rang cà phê — chạy thẳng trong Adobe Illustrator</text>
  <text class="t p"  x="66" y="216">viết nội dung bằng JavaScript, máy tự dàn trang, tự đánh số mục lục, tự gắn bookmark</text>

  <line x1="66" y1="252" x2="694" y2="252" stroke="#e5e5e5" stroke-width="1"/>
  <text class="t m" x="66"  y="276">A4 595.28 × 841.89 PT</text>
  <text class="t m" x="276" y="276">280 TRANG / TÀI LIỆU</text>
  <text class="t m" x="476" y="276">VI + EN</text>
  <text class="t m" x="586" y="276">.AI + .PDF</text>
  <line x1="66" y1="292" x2="694" y2="292" stroke="#e5e5e5" stroke-width="1"/>

  <!-- carbon display case -->
  <rect x="760" y="0" width="520" height="340" fill="#0f0e12"/>

  <!-- the product: one A4 page, the only rich object -->
  <g transform="translate(958, 46)">
    <rect x="0" y="0" width="176" height="248" fill="#ffffff"/>
    <!-- header band -->
    <rect x="0" y="0" width="176" height="15" fill="#2E74B5"/>
    <rect x="150" y="3" width="20" height="9" fill="#f6f8f7"/>
    <!-- H1 -->
    <rect x="14" y="30" width="96" height="6" fill="#232323"/>
    <!-- body lines -->
    <g fill="#b2b2b2">
      <rect x="14" y="46" width="148" height="2"/><rect x="14" y="52" width="148" height="2"/>
      <rect x="14" y="58" width="148" height="2"/><rect x="14" y="64" width="104" height="2"/>
    </g>
    <!-- H2 badge + title -->
    <circle cx="19" cy="83" r="5" fill="#4A87C7"/>
    <rect x="30" y="80" width="68" height="5" fill="#232323"/>
    <!-- safety box: the single chromatic note -->
    <rect x="14" y="96" width="148" height="30" fill="#ffffff" stroke="#E26C0A" stroke-width="1"/>
    <rect x="14" y="96" width="148" height="9" fill="#E26C0A"/>
    <path d="M22 122 L27.5 112 L33 122 Z" fill="#E26C0A"/>
    <g fill="#b2b2b2">
      <rect x="38" y="112" width="118" height="2"/><rect x="38" y="118" width="88" height="2"/>
    </g>
    <!-- image with numbered red callout -->
    <rect x="14" y="136" width="148" height="52" fill="#f6f8f7"/>
    <rect x="96" y="148" width="34" height="22" fill="none" stroke="#C00000" stroke-width="1"/>
    <circle cx="96" cy="148" r="5" fill="#C00000"/>
    <!-- table -->
    <g fill="#e5e5e5">
      <rect x="14" y="196" width="148" height="9" fill="#2E74B5"/>
      <rect x="14" y="207" width="148" height="7"/><rect x="14" y="216" width="148" height="7"/>
      <rect x="14" y="225" width="148" height="7"/>
    </g>
    <!-- footer -->
    <line x1="14" y1="238" x2="162" y2="238" stroke="#2E74B5" stroke-width="1"/>
  </g>

  <text class="t inv" x="790" y="310">ENGINE.JSX — MỘT TRANG A4 DO MÁY DÀN</text>
</svg>
