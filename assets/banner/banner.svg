<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-label="OTL Manual Builder - bo dan trang manual may rang bang Illustrator">
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#191E23"/>
      <stop offset="0.55" stop-color="#20272D"/>
      <stop offset="1"   stop-color="#12161A"/>
    </linearGradient>
    <linearGradient id="roast" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#F2A93B"/>
      <stop offset="0.5" stop-color="#E26C0A"/>
      <stop offset="1"   stop-color="#C0392B"/>
    </linearGradient>
    <linearGradient id="drumSkin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#4A5058"/>
      <stop offset="0.45" stop-color="#31373D"/>
      <stop offset="1"   stop-color="#1D2226"/>
    </linearGradient>
    <radialGradient id="ember" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#FFD27A" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#E26C0A" stop-opacity="0.75"/>
      <stop offset="1"   stop-color="#E26C0A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#5C7C99" stroke-width="0.6" opacity="0.16"/>
    </pattern>
    <pattern id="hazard" width="18" height="10" patternUnits="userSpaceOnUse" patternTransform="skewX(-35)">
      <rect width="18" height="10" fill="#14181B"/>
      <rect width="9"  height="10" fill="#FFC000"/>
    </pattern>
  </defs>

  <rect width="1280" height="340" fill="url(#steel)"/>
  <rect width="1280" height="340" fill="url(#grid)"/>
  <rect x="0" y="0"   width="1280" height="7" fill="url(#hazard)" opacity="0.9"/>
  <rect x="0" y="333" width="1280" height="7" fill="url(#hazard)" opacity="0.9"/>

  <!-- khung ban ve -->
  <rect x="24" y="22" width="1232" height="296" fill="none" stroke="#3C4A55" stroke-width="1.4"/>
  <rect x="34" y="32" width="1212" height="276" fill="none" stroke="#2E74B5" stroke-width="0.8" stroke-dasharray="7 6" opacity="0.55"/>
  <g fill="#5A646E">
    <circle cx="24"   cy="22"  r="4.5"/><circle cx="1256" cy="22"  r="4.5"/>
    <circle cx="24"   cy="318" r="4.5"/><circle cx="1256" cy="318" r="4.5"/>
  </g>

  <!-- may rang trong -->
  <g transform="translate(92,74)">
    <ellipse cx="128" cy="104" rx="150" ry="112" fill="url(#ember)" opacity="0.55"/>
    <rect x="30" y="182" width="16" height="42" fill="#2A3034"/>
    <rect x="212" y="182" width="16" height="42" fill="#2A3034"/>
    <rect x="12" y="220" width="234" height="10" rx="4" fill="#353C42"/>
    <rect x="96" y="-12" width="22" height="46" fill="#3A4249"/>
    <rect x="86" y="-22" width="42" height="14" rx="3" fill="#464F57"/>
    <rect x="20" y="30" width="216" height="156" rx="56" fill="url(#drumSkin)" stroke="#59636C" stroke-width="2"/>
    <path d="M40 60 H216" stroke="#6E7A85" stroke-width="2" opacity="0.5"/>
    <path d="M40 156 H216" stroke="#0E1113" stroke-width="3" opacity="0.6"/>
    <circle cx="128" cy="108" r="52" fill="#171C20" stroke="#6E7A85" stroke-width="3"/>
    <circle cx="128" cy="108" r="38" fill="url(#roast)" opacity="0.92"/>
    <g fill="#8B959E">
      <circle cx="128" cy="52"  r="4"/><circle cx="168" cy="68"  r="4"/><circle cx="184" cy="108" r="4"/>
      <circle cx="168" cy="148" r="4"/><circle cx="128" cy="164" r="4"/><circle cx="88"  cy="148" r="4"/>
      <circle cx="72"  cy="108" r="4"/><circle cx="88"  cy="68"  r="4"/>
    </g>
    <!-- hat ca phe trong long trong -->
    <g fill="#3E2317" stroke="#1C0F09" stroke-width="1.2">
      <g transform="translate(112,96) rotate(-18)"><ellipse rx="13" ry="9"/><path d="M-12 0 Q0 5 12 0" fill="none" stroke="#C68B59" stroke-width="1.6"/></g>
      <g transform="translate(142,118) rotate(24)"><ellipse rx="12" ry="8.5"/><path d="M-11 0 Q0 4.5 11 0" fill="none" stroke="#C68B59" stroke-width="1.6"/></g>
    </g>
    <!-- van ga -->
    <path d="M128 186 V206" stroke="#59636C" stroke-width="4"/>
    <path d="M112 206 H144" stroke="#E26C0A" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- chu -->
  <g transform="translate(392,0)">
    <rect x="0" y="78" width="60" height="4" fill="url(#roast)"/>
    <text x="72" y="86" font-family="'Consolas','Courier New',monospace" font-size="15" letter-spacing="4.5" fill="#E26C0A">O TESLA INDUSTRY  ·  TAI LIEU KY THUAT</text>
    <text x="0" y="152" font-family="'Arial Black','Segoe UI',Impact,sans-serif" font-size="56" letter-spacing="1.5" fill="#F3F6F8">MANUAL BUILDER</text>
    <text x="0" y="196" font-family="'Arial','Segoe UI',sans-serif" font-size="21" fill="#9FB0BD">Bộ dàn trang manual máy rang cà phê — Illustrator + JSX</text>
    <g font-family="'Consolas','Courier New',monospace" font-size="13.5" fill="#CFE0EC">
      <rect x="0"   y="222" width="118" height="30" rx="4" fill="#223140" stroke="#2E74B5"/>
      <text x="18"  y="242">A4 · 595×842</text>
      <rect x="130" y="222" width="126" height="30" rx="4" fill="#223140" stroke="#2E74B5"/>
      <text x="147" y="242">ISO 3864</text>
      <rect x="268" y="222" width="134" height="30" rx="4" fill="#223140" stroke="#2E74B5"/>
      <text x="284" y="242">280 trang</text>
      <rect x="414" y="222" width="150" height="30" rx="4" fill="#3A2416" stroke="#C68B59"/>
      <text x="430" y="242" fill="#F0C79A">VI + EN song ngữ</text>
    </g>
  </g>

  <!-- duong rang -->
  <g transform="translate(962,190) scale(0.72)">
    <path d="M0 96 H382" stroke="#3C4A55" stroke-width="1"/>
    <path d="M0 96 V-8"  stroke="#3C4A55" stroke-width="1"/>
    <path d="M0 92 C46 46 92 78 138 52 C196 20 248 -2 320 -40 L378 -58"
          fill="none" stroke="url(#roast)" stroke-width="4" stroke-linecap="round"/>
    <path d="M0 92 C46 46 92 78 138 52 C196 20 248 -2 320 -40 L378 -58 L378 96 L0 96 Z"
          fill="url(#roast)" opacity="0.1"/>
    <g fill="#3E2317" stroke="#C68B59" stroke-width="1.2">
      <g transform="translate(138,52) rotate(-14)"><ellipse rx="9" ry="6.2"/></g>
      <g transform="translate(248,-2) rotate(16)"><ellipse rx="9" ry="6.2"/></g>
      <g transform="translate(378,-58)"><ellipse rx="9" ry="6.2"/></g>
    </g>
    <text x="150" y="-62" font-family="'Consolas','Courier New',monospace" font-size="12" letter-spacing="2" fill="#6F8290">BT / ET  ·  ROAST CURVE</text>
  </g>
</svg>
